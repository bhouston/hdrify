packages:
  - packages/*

overrides:
  serialize-javascript: ^7.0.3
  tinypool: ^2.1.2
  zod@<4: ^4.6.6
  esbuild: 0.27.3
  conventional-changelog-conventionalcommits: 9.3.1

allowBuilds:
  '@parcel/watcher': false
  '@tailwindcss/oxide': true
  '@vscode/vsce-sign': false
  core-js: false
  esbuild: true
  exifreader: false
  keytar: false
  sharp: true

linkWorkspacePackages: true

minimumReleaseAgeExclude:
  - tanstack-router-ga4
  - yargs-file-commands
  - '@clidoc/core@1.1.0'
  - '@clidoc/yargs@1.1.0'

  # Docusaurus transitively uses core-js; its optional donation postinstall is unnecessary.
