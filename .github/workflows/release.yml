name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate and preview the release without publishing'
        type: boolean
        default: false

concurrency:
  group: npm-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Require dispatch against main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Release must be dispatched with ref=main (got ${{ github.ref }})."
          exit 1
  checks:
    needs: guard
    uses: ./.github/workflows/ci.yml
    secrets: inherit
  release:
    needs: checks
    # Enable only after all three npm trusted publishers and the baseline tag exist.
    if: vars.NPM_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require an existing release baseline
        run: git rev-parse --verify refs/tags/v1.1.4
      - run: pnpm build
      - name: Release packages and changelog
        run: pnpm release ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
      - name: Summary
        if: inputs.dry_run
        run: echo "Dry run complete — no packages were published, no tag was created." >> "$GITHUB_STEP_SUMMARY"
