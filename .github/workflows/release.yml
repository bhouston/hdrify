name: Release

on:
  push:
    branches: [main]

concurrency:
  group: npm-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    secrets: inherit
  release:
    needs: checks
    # Enable only after all three npm trusted publishers and the baseline tag exist.
    if: vars.NPM_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require an existing release baseline
        run: git rev-parse --verify refs/tags/v1.1.4
      - run: pnpm build
      - name: Release packages and changelog
        run: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
