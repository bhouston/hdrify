name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm tsc
      - run: pnpm lint
      - run: pnpm test --coverage
      - run: pnpm release:check
      - name: Bundle size budget
        run: pnpm size | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Audit dependencies
        id: audit
        continue-on-error: true
        run: pnpm audit --audit-level=high
      - name: Flag audit findings
        if: steps.audit.outcome == 'failure'
        run: echo '::warning::Dependency audit found vulnerabilities or could not reach the registry. Review the audit step.'
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}-${{ github.job }}
          path: coverage/
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: false

  contribution:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate issue link
        run: node scripts/check-pr.mjs
      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint
      - name: Lint feature commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA"
